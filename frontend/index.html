<!doctype html>
<html lang="ru" data-theme="vibe">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Твой Репетитор — ЦТ / ЦЭ</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('tutor_theme') || 'vibe';
          document.documentElement.setAttribute('data-theme', saved);
        } catch(e) {}
      })();
    </script>
    <style>
      html, body {
        background-color: #0b0b12;
        color: #f4f1ff;
        margin: 0;
        padding: 0;
      }
      [data-theme='calm'] body {
        background-color: #f3f6f4;
        color: #1c2a24;
      }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260930-learning-path" />

    <!-- ═══════════════════════════════════════════════════════════════
         Глобальный перехватчик JS-ошибок → логи контейнера через бэкенд.
         ДОЛЖЕН стоять ДО загрузки app.js, чтобы поймать ошибки старта.
         ═══════════════════════════════════════════════════════════════ -->
    <script>
      (function () {
        var LOG_URL = '/api/tutor/logs/client-error/';
        var _lastSent = 0;
        var THROTTLE_MS = 3000; // не чаще 1 раза в 3 сек (защита от спама)

        function sendError(payload) {
          var now = Date.now();
          if (now - _lastSent < THROTTLE_MS) return;
          _lastSent = now;

          var body = JSON.stringify(payload);
          // fetch предпочтительнее sendBeacon (sendBeacon не гарантирует отправку в Telegram WebView)
          try {
            fetch(LOG_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: body,
              keepalive: true
            }).catch(function () {
              // если fetch недоступен — пробуем sendBeacon как резерв
              if (navigator.sendBeacon) navigator.sendBeacon(LOG_URL, body);
            });
          } catch (e) {
            if (navigator.sendBeacon) navigator.sendBeacon(LOG_URL, body);
          }
        }

        function getTgId() {
          try {
            return window.Telegram && window.Telegram.WebApp
              ? (window.Telegram.WebApp.initDataUnsafe &&
                 window.Telegram.WebApp.initDataUnsafe.user &&
                 window.Telegram.WebApp.initDataUnsafe.user.id) || 'no_tg_user'
              : 'browser';
          } catch (e) { return 'unknown'; }
        }

        function getRoute() {
          try { return window.location.hash || window.location.pathname; } catch (e) { return ''; }
        }

        // Перехват синхронных ошибок (ReferenceError, SyntaxError, TypeError, etc.)
        window.addEventListener('error', function (event) {
          sendError({
            message: event.message || 'Unknown error',
            source: event.filename || '',
            lineno: event.lineno || 0,
            colno: event.colno || 0,
            stack: event.error ? (event.error.stack || '') : '',
            url: window.location.href,
            route: getRoute(),
            tg_id: getTgId()
          });
        });

        // Перехват необработанных Promise-rejection (async/await ошибки)
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          sendError({
            message: 'UnhandledRejection: ' + (reason && reason.message ? reason.message : String(reason)),
            source: '',
            lineno: 0,
            colno: 0,
            stack: reason && reason.stack ? reason.stack : '',
            url: window.location.href,
            route: getRoute(),
            tg_id: getTgId()
          });
        });
      })();
    </script>
  </head>
  <body>
    <!-- Заставка при запуске приложения -->
    <div id="app-splash" class="app-splash">
      <div class="splash-gears">
        <span class="splash-gear splash-gear-main">⚙️</span>
        <span class="splash-gear splash-gear-sub">⚙️</span>
      </div>
      <div class="splash-title">Твой Репетитор</div>
      <div class="splash-loading-text">Загрузка...</div>
    </div>
    <script>
      // Железная страховка: экран загрузки с шестерёнками снимется автоматически максимум через 1 секунду
      setTimeout(function() {
        var splash = document.getElementById('app-splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function() { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 300);
        }
      }, 1200);
    </script>
    <div id="atmosphere" class="atmosphere" aria-hidden="true"></div>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">Т</span>
          <div>
            <p class="brand-name">Твой Репетитор</p>
            <p class="brand-sub" id="brand-sub">ЦТ · ЦЭ</p>
          </div>
        </div>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Сменить тему">
          <span id="theme-toggle-label">Вайб</span>
        </button>
      </header>

      <main id="view" class="view"></main>

      <nav class="tabbar">
        <button type="button" class="tab active" data-route="home">Главная</button>
        <button type="button" class="tab" data-route="courses">Учёба</button>
        <button type="button" class="tab" data-route="practice">Практика</button>
        <button type="button" class="tab" data-route="stats">Статистика</button>
        <button type="button" class="tab" data-route="rating">Рейтинг</button>
        <button type="button" class="tab" data-route="profile">Профиль & Семья</button>
      </nav>
    </div>
    <script type="module" src="./app.js?v=20260930-learning-path"></script>
  </body>
</html>
