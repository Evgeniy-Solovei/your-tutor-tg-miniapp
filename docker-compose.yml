services:
  tutor_db:
    image: postgres:17-alpine
    container_name: tutor_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tutor_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  tutor_redis:
    image: redis:7-alpine
    container_name: tutor_redis
    restart: always
    volumes:
      - tutor_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  tutor_web:
    build: .
    container_name: tutor_web
    restart: always
    env_file: .env
    environment:
      POSTGRES_HOST: tutor_db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://tutor_redis:6379/0
    ports:
      - "127.0.0.1:8005:8005"
    volumes:
      - ./media:/app/media
    depends_on:
      tutor_db:
        condition: service_healthy
      tutor_redis:
        condition: service_healthy

  # Веб-сайт 1:1 с Mini App (для инвестора / демо вне Telegram).
  # Та же БД и media, отдельный процесс с WEB_SITE_ENABLED.
  tutor_site:
    build: .
    container_name: tutor_site
    restart: always
    env_file: .env
    environment:
      POSTGRES_HOST: tutor_db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://tutor_redis:6379/0
      WEB_SITE_ENABLED: "1"
      TELEGRAM_AUTH_BYPASS: "1"
      # при необходимости задай в .env: WEB_DEMO_TG_ID=123456789
    ports:
      - "127.0.0.1:8006:8005"
    volumes:
      - ./media:/app/media
    depends_on:
      tutor_db:
        condition: service_healthy
      tutor_redis:
        condition: service_healthy
      tutor_web:
        condition: service_started

  tutor_bot:
    build: .
    container_name: tutor_bot
    restart: always
    command: python telegram.py
    env_file: .env
    environment:
      POSTGRES_HOST: tutor_db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://tutor_redis:6379/0
    depends_on:
      tutor_web:
        condition: service_started

  tutor_celery:
    build: .
    container_name: tutor_celery
    restart: always
    command: celery -A tutor_bot worker --loglevel=info
    env_file: .env
    environment:
      POSTGRES_HOST: tutor_db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://tutor_redis:6379/0
    depends_on:
      tutor_web:
        condition: service_started

volumes:
  tutor_db_data:
  tutor_redis_data:
